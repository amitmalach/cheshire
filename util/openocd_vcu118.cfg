# OpenOCD script to connect to Cheshire through the internal VCU118 JTAG chain

adapter driver ftdi
adapter speed 2000
transport select jtag

# Onboard Digilent JTAG-SMT2-NC (FT232H)
ftdi_vid_pid 0x0403 0x6014
ftdi_layout_init 0x00e8 0x60eb
ftdi_channel 0

# If more than one FTDI is connected we can use the serial to differentiate.
#ftdi_serial 210308B0AD13

set _CHIPNAME riscv
# XCVU9P: production silicon, then ES1
jtag newtap $_CHIPNAME cpu -irlen 18 -expected-id 0x14B31093 -expected-id 0x04B31093

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME riscv -chain-position $_TARGETNAME

riscv set_ir idcode 0x9249
riscv set_ir dtmcs 0x22924
riscv set_ir dmi 0x23924

# The C910 boot ROM enables the caches, the data cache in write-back mode:
# memory written through the hart (program buffer) stays in the data cache
# while the core fetches from memory, so on a freshly configured FPGA a
# loaded program does not run. Prefer the debug module's system bus access.
# GDB then reads and writes memory itself, not what the core holds in its
# caches: reset the SoC before loading over a program that has already run.
riscv set_mem_access sysbus progbuf abstract

# Uncomment below to enable virtual addresses in GDB
#if { [catch {riscv set_enable_virtual on} ] } {
#    echo "Warning: This version of OpenOCD does not support address translation. To debug on virtual addresses, please update to the latest version." }

gdb_port 3333
tcl_port disabled
telnet_port disabled
